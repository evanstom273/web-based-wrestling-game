name: Bootstrap scaffold formatting

on:
  push:
    branches:
      - feat/initial-stack-scaffold

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/initial-stack-scaffold

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply repository formatting
        run: npm run format

      - name: Commit generated lockfile and formatting
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -f package-lock.json ] && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Format scaffold and lock dependencies"
          git push origin HEAD:feat/initial-stack-scaffold
